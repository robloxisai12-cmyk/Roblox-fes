name: Sierra de Guardia - Rojo CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pinned Rojo 7.7.0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin" /tmp/rojo
          curl -fsSL https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip -o /tmp/rojo/rojo.zip
          unzip -oq /tmp/rojo/rojo.zip -d /tmp/rojo
          install -m 0755 /tmp/rojo/rojo "$HOME/.local/bin/rojo"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          rojo --version
          test "$(rojo --version | grep -o '7\\.7\\.0')" = "7.7.0"
      - name: Install pinned Luau test runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/luau
          curl -fsSL https://github.com/luau-lang/luau/releases/download/0.743/luau-ubuntu.zip -o /tmp/luau/luau.zip
          unzip -oq /tmp/luau/luau.zip -d /tmp/luau
      - name: Run project checks and tests
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-phase2.mjs
          for phase in 3 4 5 6 7 8 9 10 11; do
            /tmp/luau/luau "tests/phase${phase}.test.luau"
          done
          find src tests -type f -name '*.luau' -print0 | xargs -0 -r -n1 /tmp/luau/luau-compile >/dev/null
          /tmp/luau/luau-analyze src/server/services/CombatRequestRules.luau src/server/services/CombatRules.luau src/server/services/InventoryRules.luau src/server/services/LogisticsRules.luau src/server/services/MapLayoutGenerator.luau src/server/services/MatchRules.luau src/server/services/MedicalRules.luau src/server/services/RadioRules.luau src/server/services/RankRules.luau src/server/services/SquadRegistry.luau src/server/services/SquadRequestRules.luau src/server/services/VehicleRules.luau src/shared/config/*.luau tests/phase*.test.luau
      - name: Build place
        run: |
          mkdir -p build
          rojo build default.project.json --output build/sierradeguardia.rbxlx
          test -s build/sierradeguardia.rbxlx
      - name: Upload compiled place artifact
        uses: actions/upload-artifact@v4
        with:
          name: sierradeguardia-place
          path: build/sierradeguardia.rbxlx
          if-no-files-found: error
          retention-days: 14

  save-to-roblox:
    name: Save draft place (never publish)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-24.04
    environment: roblox-saved
    steps:
      - name: Download tested place
        uses: actions/download-artifact@v4
        with:
          name: sierradeguardia-place
          path: build
      - name: Check credentials and save draft through Open Cloud
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ vars.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ vars.ROBLOX_PLACE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          : "${ROBLOX_API_KEY:?Missing ROBLOX_API_KEY secret}"
          : "${ROBLOX_UNIVERSE_ID:?Missing ROBLOX_UNIVERSE_ID variable}"
          : "${ROBLOX_PLACE_ID:?Missing ROBLOX_PLACE_ID variable}"
          [[ "$ROBLOX_UNIVERSE_ID" =~ ^[0-9]+$ ]] && [[ "$ROBLOX_PLACE_ID" =~ ^[0-9]+$ ]]
          test -s build/sierradeguardia.rbxlx
          curl --fail-with-body --silent --show-error --retry 2 \
            --request POST \
            --header "x-api-key: ${ROBLOX_API_KEY}" \
            --header "Content-Type: application/octet-stream" \
            --data-binary @build/sierradeguardia.rbxlx \
            "https://apis.roblox.com/universes/v1/${ROBLOX_UNIVERSE_ID}/places/${ROBLOX_PLACE_ID}/versions?versionType=Saved"
